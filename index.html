
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SOLVIX – Kolam AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Mukta+Mahee:wght@700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Poppins', sans-serif;
        background-color: #0c0a18;
        color: #e0e0e0;
      }
      .font-heading {
        font-family: 'Mukta Mahee', sans-serif;
      }
      .glowing-kolam {
        filter: drop-shadow(0 0 5px #FF9933) drop-shadow(0 0 15px #FF9933);
      }
      .kolam-path {
        stroke-dasharray: 1000;
        stroke-dashoffset: 1000;
        animation: draw 8s ease-in-out infinite;
      }
      @keyframes draw {
        to {
          stroke-dashoffset: 0;
        }
      }
      .gradient-text {
        background: linear-gradient(90deg, #FFD700, #FF9933, #FFD700);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        text-fill-color: transparent;
      }
      .card-glow {
        position: relative;
        overflow: hidden;
      }
      .card-glow::before {
        content: '';
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: radial-gradient(circle at var(--mouse-x) var(--mouse-y), rgba(255, 153, 51, 0.15), transparent 40%);
        opacity: 0;
        transition: opacity 0.3s;
        pointer-events: none;
      }
      .card-glow:hover::before {
        opacity: 1;
      }
    </style>
